failover:

failover/default:
  priority_levels:
    - [traces]

failover/full:
  priority_levels:
    - [ traces/first, traces/also_first ]
    - [ traces/second ]
    - [ traces/third ]
    - [ traces/fourth ]
  retry_interval: 5m

failover/queue:
  priority_levels:
    - [ traces/first, traces/also_first ]
    - [ traces/second ]
    - [ traces/third ]
    - [ traces/fourth ]
  sending_queue:
    enabled: true
    
failover/invalid:
  priority_levels:
    - [ traces/first ]
    - [ traces/second ]
  retry_interval: 0m

failover/condition:
  priority_levels:
    - [ traces/first ]
    - [ traces/second ]
  retry_interval: 5m
  condition:
    error:
      contains: ["network failure", "connection refused"]

failover/emptycondition:
  priority_levels:
    - [ traces/first ]
    - [ traces/second ]
  condition: {}

failover/emptyerrorcontains:
  priority_levels:
    - [ traces/first ]
    - [ traces/second ]
  retry_interval: 5m
  condition:
    error: {}

failover/spill:
  priority_levels:
    - [ logs/primary ]
    - [ logs/spill ]
  retry_interval: 30s
  failover_after: 2m
  retry_timeout: 5s
  sending_queue:
    enabled: false
  condition:
    error:
      permanent: false

failover/negativeduration:
  priority_levels:
    - [ traces/first ]
    - [ traces/second ]
  failover_after: -1s
