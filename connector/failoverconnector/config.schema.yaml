$defs:
  conditions_config:
    description: It plugs in all the available implementations of `Condition`. At most only one condition can be set
    type: object
    properties:
      error:
        x-pointer: true
        $ref: error_condition
  error_condition:
    description: ErrorCondition implements Condition
    type: object
    properties:
      contains:
        description: Contains lists case-insensitive substrings matched against downstream errors. An error matching any substring triggers failover.
        type: array
        items:
          type: string
      permanent:
        description: Permanent controls whether permanent errors (consumererror.IsPermanent) trigger failover. When unset they are treated like any other error. When false they are returned to the caller as is.
        x-pointer: true
        type: boolean
type: object
properties:
  condition:
    description: Condition is an optional user-defined rule that controls which downstream errors trigger failover. When omitted, all errors trigger failover.
    x-optional: true
    $ref: conditions_config
  failover_after:
    description: FailoverAfter is how long a level must keep failing, without a single success, before the connector moves to the next level. Until then errors are returned to the caller so upstream can retry. Zero fails over on the first error.
    type: string
    format: duration
  priority_levels:
    description: PipelinePriority is the list of pipeline level priorities in a 1 - n configuration, multiple pipelines can sit at a single priority level and will be routed in a fanout. If any pipeline at a level fails, the level is considered unhealthy
    type: array
    items:
      type: array
      items:
        $ref: go.opentelemetry.io/collector/pipeline.id
  retry_interval:
    description: RetryInterval is the frequency at which the pipeline levels will attempt to recover by going over all levels below the current
    type: string
    format: duration
  retry_timeout:
    description: RetryTimeout bounds each recovery attempt on a higher level, so a level that is still down cannot hold up live data for longer. Zero means no bound beyond the caller's context.
    type: string
    format: duration
  sending_queue:
    description: QueueSettings use the exporterhelper sending_queue to move the queue to the connector to avoid data being stuck in the queue of an unhealthy exporter
    x-optional: true
    $ref: go.opentelemetry.io/collector/exporter/exporterhelper.queue_batch_config
